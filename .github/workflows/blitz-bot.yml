name: Blitz Top Performer Bot

on:
  schedule:
    # GitHub uses UTC. These windows cover NFL game times (ET):
    - cron: "*/15 17-23 * * 0"   # Sunday 12pm-7pm ET (early + late games)
    - cron: "*/15 0-5 * * 1"     # Sunday night game
    - cron: "*/15 0-5 * * 2"     # Monday night game
    - cron: "*/15 0-5 * * 5"     # Thursday night game
  workflow_dispatch:             # lets you click "Run workflow" manually
    inputs:
      game_id:
        description: "Optional: ESPN game ID to (re)run for testing"
        required: false
        default: ""

permissions:
  contents: write                # so it can save posted.json

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python bot.py
        env:
          PYTHONUNBUFFERED: "1"
          MODE: ${{ vars.MODE || 'draft' }}
          IMAGE_MODE: ${{ vars.IMAGE_MODE || 'screenshot' }}
          FORCE_GAME_ID: ${{ github.event.inputs.game_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLITZ_PRICE_URL: ${{ secrets.BLITZ_PRICE_URL }}
          BLITZ_API_KEY: ${{ secrets.BLITZ_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: Save posted games
        run: |
          git config user.name "blitz-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json || true
          git diff --cached --quiet || (git commit -m "bot: update posted games" && git push)
