name: Blitz Top Performer Bot

on:
  schedule:
    # GitHub uses UTC. Blitz updates prices at noon ET the day after each game
    # (retries 1pm/3pm ET), so Monday-night prices are final by ~3pm ET Tuesday.
    - cron: "7 21 * * 2"   # Tuesday ~4pm ET: post every game from the past week
    - cron: "7 23 * * 2"   # Tuesday ~6pm ET: retry any games that failed or were paused
  workflow_dispatch:             # lets you click "Run workflow" manually
    inputs:
      game_id:
        description: "Optional: ESPN game ID to (re)run for testing"
        required: false
        default: ""

permissions:
  contents: write                # so it can save posted.json

concurrency:
  group: blitz-bot               # never run two batches at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python bot.py
        env:
          PYTHONUNBUFFERED: "1"
          MODE: ${{ vars.MODE || 'draft' }}
          IMAGE_MODE: ${{ vars.IMAGE_MODE || 'screenshot' }}
          POST_GAP_MINUTES: ${{ vars.POST_GAP_MINUTES || '10' }}
          FORCE_GAME_ID: ${{ github.event.inputs.game_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLITZ_PRICE_URL: ${{ secrets.BLITZ_PRICE_URL }}
          BLITZ_API_KEY: ${{ secrets.BLITZ_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: Save posted games
        if: always()
        run: |
          git config user.name "blitz-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json || true
          git diff --cached --quiet || (git commit -m "bot: update posted games" && git push)
